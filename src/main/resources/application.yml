spring:
  application:
    name: order-service

  # Defaults target a locally running docker-compose stack; every value can be
  # overridden through SPRING_* environment variables (see docker-compose.yml).
  datasource:
    url: jdbc:postgresql://localhost:5432/orders
    username: orders
    password: orders

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:29092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      # acks=all plus idempotence: the broker confirms the write reached every
      # in-sync replica, and a retried send cannot leave a duplicate on the log.
      acks: all
      retries: 3
      properties:
        enable.idempotence: true

app:
  kafka:
    partitions: 3
    replication-factor: 1
    topics:
      orders: orders

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
