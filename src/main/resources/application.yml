spring:
  application:
    name: order-service

  # Defaults target a locally running docker-compose stack; every value can be
  # overridden through SPRING_* environment variables (see docker-compose.yml).
  datasource:
    url: jdbc:postgresql://localhost:5432/orders
    username: orders
    password: orders

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:29092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      # acks=all plus idempotence: the broker confirms the write reached every
      # in-sync replica, and a retried send cannot leave a duplicate on the log.
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest
      # Offsets are committed by the listener, never by a background timer, so a
      # crash mid-processing replays the event instead of losing it.
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.yz.orderservice.event
    listener:
      ack-mode: manual_immediate
      # One consumer thread per partition, so a listener can work through a
      # backlog in parallel instead of serialising every partition onto one
      # thread. Raising it past app.kafka.partitions only leaves threads idle.
      concurrency: 3

app:
  kafka:
    partitions: 3
    replication-factor: 1
    topics:
      orders: orders
      orders-reserved: orders.reserved
      orders-completed: orders.completed
  stock:
    units-per-product: 100
    # Reserving any of these always fails, which exercises the FAILED path on demand.
    unavailable-products: sku-unavailable
  payment:
    # Share of calls the simulated provider rejects. Set to 1.0 to trip the breaker.
    failure-rate: 0.0
    latency-millis: 50

resilience4j:
  circuitbreaker:
    instances:
      payment:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      # Every meter carries the service name, so a second service scraped by the
      # same Prometheus stays distinguishable in a shared dashboard.
      application: ${spring.application.name}
    distribution:
      # Latency percentiles have to be computed by Prometheus across instances,
      # not averaged from per-instance summaries — that needs raw histogram buckets.
      percentiles-histogram:
        http.server.requests: true
        orders.pipeline: true
        orders.stage: true
        spring.kafka.listener: true
      # The pipeline spans two hops through Kafka, so its timings live in a range
      # the default bucket set barely covers. These bounds shape the buckets
      # around it without changing what is recorded.
      minimum-expected-value:
        orders.pipeline: 10ms
        orders.stage: 1ms
      maximum-expected-value:
        orders.pipeline: 30s
        orders.stage: 10s
