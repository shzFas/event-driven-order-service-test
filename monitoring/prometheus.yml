global:
  # Short interval on purpose: the demos in the README are minutes long, and a
  # 15s default makes a lag spike look like three data points.
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # Application metrics: JVM, HTTP, Kafka client, circuit breaker.
  - job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app:8080"]

  # Broker-side consumer lag, independent of whether the app is even running.
  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
