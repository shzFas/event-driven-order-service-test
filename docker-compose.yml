services:
  postgres:
    image: postgres:16-alpine
    container_name: order-postgres
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka-native:4.1.2
    container_name: order-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      # PLAINTEXT is what other containers use, PLAINTEXT_HOST is for the host machine.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "29092:29092"
    healthcheck:
      # The native image ships only the broker binary — no kafka-topics.sh —
      # so the readiness probe is a plain TCP check on the broker listener.
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s

  app:
    build: .
    container_name: order-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orders
      SPRING_DATASOURCE_USERNAME: orders
      SPRING_DATASOURCE_PASSWORD: orders
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Share of payment calls the simulated provider rejects. Raise it to watch
      # the circuit breaker open:
      #   APP_PAYMENT_FAILURE_RATE=1.0 docker compose up -d app
      APP_PAYMENT_FAILURE_RATE: ${APP_PAYMENT_FAILURE_RATE:-0.0}
      # What one simulated charge costs. It is the slowest step in the chain, so
      # lowering it is the quickest way to raise end-to-end throughput.
      APP_PAYMENT_LATENCY_MILLIS: ${APP_PAYMENT_LATENCY_MILLIS:-50}
      # Stock is held in memory and never replenished, so a load run long enough
      # to drain a product turns into a stream of FAILED orders. Generous by
      # default; the stock gauges on the dashboard show how much is left.
      APP_STOCK_UNITS_PER_PRODUCT: ${APP_STOCK_UNITS_PER_PRODUCT:-1000000}
      # Consumer threads per listener. Beyond app.kafka.partitions (3) the extra
      # threads get no partition assigned and sit idle.
      SPRING_KAFKA_LISTENER_CONCURRENCY: ${SPRING_KAFKA_LISTENER_CONCURRENCY:-3}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Continuous mock traffic. Off unless asked for, because a dashboard that is
  # never idle hides the difference between load and a stuck pipeline:
  #   docker compose --profile load up -d loadgen
  #   docker compose logs -f loadgen
  # Everything about the traffic is tunable from the environment, e.g.
  #   LOADGEN_RATE=200 LOADGEN_CONCURRENCY=32 docker compose --profile load up -d loadgen
  loadgen:
    image: python:3.13-alpine
    container_name: order-loadgen
    profiles: ["load"]
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts:ro
    environment:
      LOADGEN_URL: http://app:8080
      LOADGEN_RATE: ${LOADGEN_RATE:-20}
      LOADGEN_CONCURRENCY: ${LOADGEN_CONCURRENCY:-8}
      LOADGEN_DURATION: ${LOADGEN_DURATION:-0}
      LOADGEN_RAMP: ${LOADGEN_RAMP:-0}
      LOADGEN_PRODUCTS: ${LOADGEN_PRODUCTS:-8}
      LOADGEN_UNAVAILABLE_SHARE: ${LOADGEN_UNAVAILABLE_SHARE:-0.02}
      LOADGEN_DUPLICATE_SHARE: ${LOADGEN_DUPLICATE_SHARE:-0.02}
      LOADGEN_FOLLOW_SHARE: ${LOADGEN_FOLLOW_SHARE:-0.05}
    # -u keeps the progress lines flowing into `docker compose logs -f` instead
    # of sitting in a block buffer.
    command: ["python3", "-u", "/scripts/loadgen.py"]
    # Restarted if it dies, but not after a LOADGEN_DURATION run finishes on its
    # own — `unless-stopped` would turn a two-minute run into an endless loop.
    restart: on-failure:3

  # Broker-side consumer lag. The application's own Kafka client also reports
  # lag, but it goes silent exactly when the app is down — which is when the
  # number matters most.
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: order-kafka-exporter
    depends_on:
      kafka:
        condition: service_healthy
    # Pinning the protocol version keeps Sarama from negotiating down to a
    # dialect Kafka 4 no longer speaks.
    command: ["--kafka.server=kafka:9092", "--kafka.version=3.6.0"]
    ports:
      - "9308:9308"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.6.0
    container_name: order-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.2.0
    container_name: order-grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # It is a local demo stack; the login screen adds nothing but a click.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      # Datasource and dashboard are provisioned from the repository, so the
      # stack comes up already wired instead of needing a manual import.
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
